<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>ZK FITSS Journal | Fashion & Style</title><meta name="description" content="Fashion inspiration, styling ideas and updates from ZK FITSS."><link rel="canonical" href="https://www.zkfitss.com/blog.html"><link rel="icon" href="/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#292522;font:15px/1.7 'DM Sans',sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6dfd6;padding:8px 0 22px}.brand{font:700 25px 'Playfair Display',serif;letter-spacing:2px}.top a{margin-left:18px;text-decoration:none;color:inherit}.intro{text-align:center;padding:55px 0 35px}.intro small{letter-spacing:3px}.intro h1{font:500 clamp(38px,6vw,60px) 'Playfair Display',serif;margin:10px}.intro p{color:#777;max-width:620px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px}.post{background:white;border:1px solid #eee7df}.post img{width:100%;aspect-ratio:1.45;object-fit:cover;background:#eee}.post .body{padding:20px}.post small{color:#8b7764}.post h2{font:500 25px/1.25 'Playfair Display',serif;margin:8px 0}.post p{color:#746d66}.post a{color:inherit;text-decoration:none}.article{max-width:800px;margin:40px auto;background:white;padding:clamp(22px,5vw,55px)}.article img{width:100%;max-height:480px;object-fit:cover}.article h1{font:500 clamp(36px,6vw,54px)/1.15 'Playfair Display',serif}.article .content{white-space:pre-wrap;font-size:17px;line-height:1.9}.muted{color:#777;text-align:center;padding:35px}</style></head><body><div class="wrap"><nav class="top"><a class="brand" href="/">ZK FITSS</a><div><a href="/">Home</a><a href="/">Shop</a></div></nav><header class="intro"><small>THE ZK FITSS JOURNAL</small><h1>Style, stories & inspiration.</h1><p>Discover styling ideas, fashion inspiration and the latest stories from ZK FITSS.</p></header><main id="blogContent"><p class="muted">Loading articles…</p></main></div><script>
const root=document.getElementById('blogContent');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const slug=params.get('slug');
(async()=>{try{if(slug){const r=await fetch('/api/blog?slug='+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error(d.error);const p=d.post;document.title=(p.seo_title||p.title)+' | ZK FITSS';let desc=document.querySelector('meta[name=description]');desc.content=p.seo_description||p.excerpt||'';root.innerHTML=`<article class="article"><a href="/blog.html">← All articles</a><p><small>${esc(p.category)} · ${esc((p.published_at||'').slice(0,10))}</small></p><h1>${esc(p.title)}</h1>${p.cover_image?`<img src="${esc(p.cover_image)}" alt="${esc(p.title)}">`:''}<p>${esc(p.excerpt)}</p><div class="content">${esc(p.content)}</div></article>`;const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BlogPosting',headline:p.title,description:p.seo_description||p.excerpt,image:p.cover_image||undefined,datePublished:p.published_at||undefined,mainEntityOfPage:location.href,publisher:{'@type':'Organization',name:'ZK FITSS'}});document.head.appendChild(ld);}else{const r=await fetch('/api/blog');const d=await r.json();const posts=d.posts||[];root.innerHTML=posts.length?`<div class="grid">${posts.map(p=>`<article class="post"><a href="/blog.html?slug=${encodeURIComponent(p.slug)}">${p.cover_image?`<img src="${esc(p.cover_image)}" alt="${esc(p.title)}">`:''}<div class="body"><small>${esc(p.category)} · ${esc((p.published_at||'').slice(0,10))}</small><h2>${esc(p.title)}</h2><p>${esc(p.excerpt)}</p><strong>Read article →</strong></div></a></article>`).join('')}</div>`:'<p class="muted">No articles published yet. Please check back soon.</p>';}}catch(e){root.innerHTML=`<p class="muted">${esc(e.message||'Unable to load articles.')}</p>`;}})();
</script></body></html>
